# systemd drop-in for ai-backend.service — Scientific Runtime configuration.
# Values are templated by the GitHub Actions deploy workflow from Repository
# Variables (fail-closed defaults). Not committed secrets.
[Service]
Environment="SCIENTIFIC_RUNTIME_BASE_URL=http://127.0.0.1:8101"
Environment="SCIENTIFIC_RUNTIME_TIMEOUT=10"
Environment="DATA_PRODUCER_EXECUTION_ENABLED=false"
