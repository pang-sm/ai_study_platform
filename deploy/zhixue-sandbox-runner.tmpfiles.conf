# Runtime directory for the sandbox runner socket — SECURITY_S0B-P1 / Stage 5A.
#
# /run is a tmpfs, so the socket directory has to be recreated on every boot. It is
# declared here rather than with systemd's RuntimeDirectory= because the GROUP is the
# access-control boundary: the socket inherits this directory's group (setgid) and its
# permissions come from the service umask, so a directory owned by zhixue-ipc is what makes
# the socket reachable by the web identity and by nobody else.
#
#   d  path                mode owner          group      age
d    /run/zhixue-sandbox  2750 zhixue-sandbox zhixue-ipc -
