name: Audit course preference conflict

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s' "${{ secrets.TENCENT_SSH_KEY }}" > "$HOME/.ssh/tencent_audit_key"
          chmod 600 "$HOME/.ssh/tencent_audit_key"
          ssh-keyscan -H "${{ secrets.TENCENT_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Query course_learning_preferences
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
        run: |
          set -euo pipefail
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"
          HOST_CLEAN="${HOST_CLEAN%%/*}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/tencent_audit_key" -p "$SSH_PORT" "$TENCENT_USER@$HOST_CLEAN" 'bash -se' <<'REMOTE'
          set -euo pipefail
          DATA_DB=/var/lib/ai_study_platform/app.db
          echo '=== schema ==='
          sudo sqlite3 "$DATA_DB" "PRAGMA index_list(course_learning_preferences);"
          echo '=== all rows ==='
          sudo sqlite3 -header -csv "$DATA_DB" "SELECT * FROM course_learning_preferences ORDER BY username, course_id;"
          echo '=== duplicate (username,course_id) count ==='
          sudo sqlite3 -header -csv "$DATA_DB" "SELECT username, course_id, COUNT(*) c FROM course_learning_preferences GROUP BY username, course_id HAVING c > 1;"
          echo '=== backend status ==='
          sudo systemctl status ai-backend --no-pager -l | head -20 || true
          REMOTE
