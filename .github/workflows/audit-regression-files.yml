name: Audit regression test files

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s' "${{ secrets.TENCENT_SSH_KEY }}" > "$HOME/.ssh/tencent_audit_key"
          chmod 600 "$HOME/.ssh/tencent_audit_key"
          ssh-keyscan -H "${{ secrets.TENCENT_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Query and clean regression files
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
        run: |
          set -euo pipefail
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"
          HOST_CLEAN="${HOST_CLEAN%%/*}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/tencent_audit_key" -p "$SSH_PORT" "$TENCENT_USER@$HOST_CLEAN" 'bash -se' <<'REMOTE'
          set -euo pipefail
          DATA_DB=/var/lib/ai_study_platform/app.db
          echo '=== regression test files (before cleanup) ==='
          sudo sqlite3 -header -csv "$DATA_DB" <<'SQL'
          SELECT id, original_filename AS filename, subject, course_id, subject_key, created_at
          FROM study_materials
          WHERE original_filename LIKE 'regression-%'
          ORDER BY id;
          SQL
          echo '=== cleanup regression test files ==='
          sudo sqlite3 "$DATA_DB" <<'SQL'
          DELETE FROM material_chunks WHERE material_id IN (SELECT id FROM study_materials WHERE original_filename LIKE 'regression-%');
          DELETE FROM study_materials WHERE original_filename LIKE 'regression-%';
          SQL
          echo '=== remaining regression files (should be empty) ==='
          sudo sqlite3 -header -csv "$DATA_DB" "SELECT id, original_filename FROM study_materials WHERE original_filename LIKE 'regression-%';"
          REMOTE
