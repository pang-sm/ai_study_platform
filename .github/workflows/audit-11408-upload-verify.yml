name: Audit 11408 upload scope verify

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s' "${{ secrets.TENCENT_SSH_KEY }}" > "$HOME/.ssh/tencent_audit_key"
          chmod 600 "$HOME/.ssh/tencent_audit_key"
          ssh-keyscan -H "${{ secrets.TENCENT_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Verify new upload scope
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
        run: |
          set -euo pipefail
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"
          HOST_CLEAN="${HOST_CLEAN%%/*}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/tencent_audit_key" -p "$SSH_PORT" "$TENCENT_USER@$HOST_CLEAN" 'bash -se' <<'REMOTE'
          set -euo pipefail
          DATA_DB=/var/lib/ai_study_platform/app.db
          echo '=== new upload material scope ==='
          sudo sqlite3 -header -csv "$DATA_DB" <<'SQL'
          SELECT id, original_filename AS filename, subject, course_id, subject_key,
                 source_type, parse_status AS index_status, chunk_count, created_at, is_deleted
          FROM study_materials
          WHERE original_filename LIKE 'scope-11408-coa-final-%'
          ORDER BY id DESC LIMIT 5;
          SQL
          echo '=== new upload chunk scope ==='
          sudo sqlite3 -header -csv "$DATA_DB" <<'SQL'
          SELECT mc.material_id, mc.course_id, mc.subject_key, mc.subject, COUNT(*) AS chunk_count
          FROM material_chunks mc
          WHERE mc.material_id IN (SELECT id FROM study_materials WHERE original_filename LIKE 'scope-11408-coa-final-%')
            AND mc.is_deleted = 0
          GROUP BY mc.material_id, mc.course_id, mc.subject_key, mc.subject;
          SQL
          echo '=== 11408 computer_organization final totals ==='
          sudo sqlite3 -header -csv "$DATA_DB" <<'SQL'
          SELECT subject, course_id, subject_key, COUNT(*) AS material_count, SUM(chunk_count) AS chunk_count
          FROM study_materials
          WHERE course_id = 'computer_organization_11408' AND is_deleted = 0
          GROUP BY subject, course_id, subject_key;
          SQL
          REMOTE
