name: StudentTwin Production Canary

# Manual production verification ONLY. It never redeploys code; it uses the already-deployed
# Data Plane code + the loopback Scientific Runtime Service. No arbitrary user input.
on:
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
        run: |
          set -euo pipefail
          : "${TENCENT_HOST:?TENCENT_HOST secret required}"
          : "${TENCENT_SSH_KEY:?TENCENT_SSH_KEY secret required}"
          SSH_PORT="${SSH_PORT:-22}"
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$TENCENT_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/tencent_deploy_key"
          chmod 600 "$HOME/.ssh/tencent_deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/tencent_deploy_key" >/dev/null 2>/tmp/canary-keygen.err
          ssh-keyscan -T 20 -p "$SSH_PORT" -H "$HOST_CLEAN" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          echo "[canary] SSH ready"

      - name: Run production canary (no arbitrary input)
        shell: bash
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
        run: |
          set -euo pipefail
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"
          SSH_PORT="${SSH_PORT:-22}"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -i "$HOME/.ssh/tencent_deploy_key" -p "$SSH_PORT" \
            "$TENCENT_USER@$HOST_CLEAN" 'bash -se' <<'CANARYEOF'
          set -euo pipefail
          cd "$HOME/ai_study_platform"
          echo "[canary] running verify_student_twin_production_canary.py"
          DATABASE_URL="sqlite:////var/lib/ai_study_platform/app.db" \
          SCIENTIFIC_RUNTIME_BASE_URL="http://127.0.0.1:8101" \
          DATA_PRODUCER_EXECUTION_ENABLED=true \
          backend/.venv/bin/python scripts/verify_student_twin_production_canary.py
          CANARYEOF
