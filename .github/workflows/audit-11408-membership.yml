name: Audit 11408 membership truth

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s' "${{ secrets.TENCENT_SSH_KEY }}" > "$HOME/.ssh/tencent_audit_key"
          chmod 600 "$HOME/.ssh/tencent_audit_key"
          ssh-keyscan -H "${{ secrets.TENCENT_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Query membership truth
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
        run: |
          set -euo pipefail
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"
          HOST_CLEAN="${HOST_CLEAN%%/*}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/tencent_audit_key" -p "$SSH_PORT" "$TENCENT_USER@$HOST_CLEAN" 'bash -se' <<'REMOTE'
          set -euo pipefail
          DATA_DB=/var/lib/ai_study_platform/app.db
          echo '=== users (奶12, id=58) legacy plan fields ==='
          sudo sqlite3 -header -csv "$DATA_DB" "SELECT id, username, plan, plan_expire_at, plan_source, is_admin FROM users WHERE id = 58;"
          echo '=== user_service_memberships for user 58 ==='
          sudo sqlite3 -header -csv "$DATA_DB" "SELECT id, user_id, service_key, is_enabled, plan, status, activated_at, expires_at, created_at, updated_at FROM user_service_memberships WHERE user_id = 58;"
          echo '=== user_learning_tracks for user 58 ==='
          sudo sqlite3 -header -csv "$DATA_DB" "SELECT id, user_id, track_type, plan, package_type, permissions_json, quota_json, is_active, status, updated_at FROM user_learning_tracks WHERE user_id = 58;"
          echo '=== membership_orders for user 58 ==='
          sudo sqlite3 -header -csv "$DATA_DB" "SELECT id, user_id, service_key, target_plan, amount, status, paid_at, membership_expires_at, created_at FROM membership_orders WHERE user_id = 58 ORDER BY id DESC LIMIT 10;"
          echo '=== redemption_code_usages for user 58 ==='
          sudo sqlite3 -header -csv "$DATA_DB" "SELECT * FROM redemption_code_usages WHERE user_id = 58 ORDER BY id DESC LIMIT 10;"
          REMOTE
