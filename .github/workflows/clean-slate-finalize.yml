name: Clean Slate Finalize

# One-shot production clean-slate finalization. Fixed logic only — no arbitrary input.
# Purges user-generated files + old DB backups, and audits/resolves financial records.
on:
  workflow_dispatch:

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
        run: |
          set -euo pipefail
          : "${TENCENT_HOST:?}"
          : "${TENCENT_SSH_KEY:?}"
          SSH_PORT="${SSH_PORT:-22}"
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$TENCENT_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/tencent_deploy_key"
          chmod 600 "$HOME/.ssh/tencent_deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/tencent_deploy_key" >/dev/null 2>/tmp/finalize-keygen.err
          ssh-keyscan -T 20 -p "$SSH_PORT" -H "$HOST_CLEAN" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          echo "[finalize] SSH ready"

      - name: Run clean-slate finalization (no arbitrary input)
        shell: bash
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
        run: |
          set -euo pipefail
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"
          SSH_PORT="${SSH_PORT:-22}"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -i "$HOME/.ssh/tencent_deploy_key" -p "$SSH_PORT" \
            "$TENCENT_USER@$HOST_CLEAN" 'bash -se' <<'FINALIZEEOF'
          set -euo pipefail
          cd "$HOME/ai_study_platform"
          echo "[finalize] running finalize_clean_slate.py"
          PURGE_DB_PATH="/var/lib/ai_study_platform/app.db" \
          UPLOADS_DIR="$HOME/ai_study_platform/backend/uploads" \
          BACKUP_DIRS="$HOME/ai_study_platform/backend/backups:/var/lib/ai_study_platform/backups" \
          backend/.venv/bin/python scripts/finalize_clean_slate.py
          FINALIZEEOF
