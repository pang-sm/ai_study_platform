name: Security — Question Bank Integrity Inventory

# SECURITY_S1B follow-up: a READ-ONLY count of the production CS408 question bank.
#
# S1B closed the endpoint that let any authenticated learner write shared rows into the bank.
# The open question is historical — were any written before the fix? This runs the inventory
# in scripts/deploy/question_bank_integrity_inventory.py, which opens the database with SQLite
# `mode=ro`, takes no input of any kind, runs only fixed literal queries, and prints counts and
# category labels (never an owner name, stem, answer or analysis).
#
# Fixed logic only: no SQL, path or shell parameter is accepted. It writes nothing.
on:
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
        run: |
          set -euo pipefail
          : "${TENCENT_HOST:?TENCENT_HOST secret required}"
          : "${TENCENT_SSH_KEY:?TENCENT_SSH_KEY secret required}"
          SSH_PORT="${SSH_PORT:-22}"
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$TENCENT_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/tencent_deploy_key"
          chmod 600 "$HOME/.ssh/tencent_deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/tencent_deploy_key" >/dev/null 2>/tmp/integrity-keygen.err
          ssh-keyscan -T 20 -p "$SSH_PORT" -H "$HOST_CLEAN" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          echo "[integrity] SSH ready"

      - name: Run the read-only inventory
        shell: bash
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
        run: |
          set -euo pipefail
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"
          SSH_PORT="${SSH_PORT:-22}"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -i "$HOME/.ssh/tencent_deploy_key" -p "$SSH_PORT" \
            "$TENCENT_USER@$HOST_CLEAN" 'bash -se' <<'INTEGRITYEOF'
          set -euo pipefail
          # Resolve the release root the way deploy.yml does: the running unit's
          # WorkingDirectory is the tree actually serving traffic, so this follows
          # the Stage 5B move instead of addressing the tree it left behind.
          APP_ROOT="$(systemctl show ai-backend -p WorkingDirectory --value | sed 's#/backend$##')"
          [ -d "${APP_ROOT:-}" ] || APP_ROOT="$HOME/ai_study_platform"
          cd "$APP_ROOT"
          DATABASE_URL="sqlite:////var/lib/ai_study_platform/app.db" \
            backend/.venv/bin/python scripts/deploy/question_bank_integrity_inventory.py
          echo "[integrity] done"
          INTEGRITYEOF
