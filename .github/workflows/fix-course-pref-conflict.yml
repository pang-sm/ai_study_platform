name: Fix course preference conflict

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s' "${{ secrets.TENCENT_SSH_KEY }}" > "$HOME/.ssh/tencent_audit_key"
          chmod 600 "$HOME/.ssh/tencent_audit_key"
          ssh-keyscan -H "${{ secrets.TENCENT_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Dedupe and restart backend
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
        run: |
          set -euo pipefail
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"
          HOST_CLEAN="${HOST_CLEAN%%/*}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/tencent_audit_key" -p "$SSH_PORT" "$TENCENT_USER@$HOST_CLEAN" 'bash -se' <<'REMOTE'
          set -euo pipefail
          DATA_DB=/var/lib/ai_study_platform/app.db
          AUDIT_DIR=/var/lib/ai_study_platform/audits
          TIMESTAMP="$(date -u +%Y%m%d_%H%M%S)"
          SNAPSHOT="$AUDIT_DIR/app.db.before-course-pref-fix.$TIMESTAMP.db"
          sudo mkdir -p "$AUDIT_DIR"
          sudo sqlite3 "$DATA_DB" ".timeout 5000" ".backup '$SNAPSHOT'"
          echo "snapshot=$SNAPSHOT"

          echo '=== BEFORE ==='
          sudo sqlite3 -header -csv "$DATA_DB" "SELECT id, username, course_id FROM course_learning_preferences WHERE username='奶12' ORDER BY id;"

          # Delete the old-alias row that the startup migration (计算机组成原理 → 计算机组成结构)
          # would merge into an existing canonical row, causing a UNIQUE constraint violation.
          sudo sqlite3 "$DATA_DB" <<'SQL'
          DELETE FROM course_learning_preferences
          WHERE course_id = '计算机组成原理'
            AND username IN (
              SELECT username FROM course_learning_preferences WHERE course_id = '计算机组成结构'
            );
          SQL

          echo '=== AFTER ==='
          sudo sqlite3 -header -csv "$DATA_DB" "SELECT id, username, course_id FROM course_learning_preferences WHERE username='奶12' ORDER BY id;"

          echo '=== restart backend ==='
          sudo systemctl restart ai-backend
          sleep 6
          sudo systemctl is-active ai-backend || true
          sudo systemctl status ai-backend --no-pager -l | head -12 || true
          REMOTE
