name: Security — Revoke All Sessions & Secret Inventory

# SECURITY_S0.5 post-incident containment for the SECURITY_S0 host-RCE window.
#
# The read primitive reached app.db, which stores auth_sessions.token_hash. Raw tokens are
# never persisted, so a stolen hash is not directly replayable — but the endpoint that could
# have leaked it logged nothing, so "we cannot prove it was unused" is the operative fact,
# and invalidating every live session is the conservative answer.
#
# It also classifies the systemd drop-ins the incident review could not see: it prints each
# file's mode and the NAMES of the variables it sets, never any value. That is what turns
# "some 0644 file sits in the secret directory" into a decidable question.
#
# Fixed logic only, no arbitrary input. It never touches users, passwords, memberships or
# learning data, and it is idempotent.
on:
  workflow_dispatch:

jobs:
  revoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
        run: |
          set -euo pipefail
          : "${TENCENT_HOST:?TENCENT_HOST secret required}"
          : "${TENCENT_SSH_KEY:?TENCENT_SSH_KEY secret required}"
          SSH_PORT="${SSH_PORT:-22}"
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$TENCENT_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/tencent_deploy_key"
          chmod 600 "$HOME/.ssh/tencent_deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/tencent_deploy_key" >/dev/null 2>/tmp/revoke-keygen.err
          ssh-keyscan -T 20 -p "$SSH_PORT" -H "$HOST_CLEAN" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          echo "[revoke] SSH ready"

      - name: Revoke sessions, inventory secrets and harden the drop-in
        shell: bash
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
        run: |
          set -euo pipefail
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"
          SSH_PORT="${SSH_PORT:-22}"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -i "$HOME/.ssh/tencent_deploy_key" -p "$SSH_PORT" \
            "$TENCENT_USER@$HOST_CLEAN" 'bash -se' <<'REVOKEEOF'
          set -euo pipefail
          cd "$HOME/ai_study_platform"
          UNIT_DIR=/etc/systemd/system/ai-backend.service.d
          ALL_UNITS="/etc/systemd/system/ai-backend.service"

          echo "[revoke] === drop-in mode + variable NAMES (never values) ==="
          for f in $UNIT_DIR/*.conf; do
            [ -e "$f" ] || continue
            stat -c '[revoke]   mode %a  %n' "$f"
            # Print only the environment variable NAMES each file sets.
            sudo grep -oE 'Environment="?[A-Za-z_][A-Za-z0-9_]*=' "$f" 2>/dev/null \
              | sed -E 's/^Environment="?//; s/=$//' \
              | sort -u \
              | sed 's/^/[revoke]       var /' || true
          done

          echo "[revoke] === canonical AI provider env NAMES present in unit config ==="
          # Names only. This answers "which providers are configured" without reading a value.
          for name in DEEPSEEK_API_KEY DASHSCOPE_API_KEY ARK_API_KEY MOONSHOT_API_KEY ZHIPUAI_API_KEY MINIMAX_API_KEY; do
            if sudo grep -qE "Environment=\"?${name}=" $ALL_UNITS $UNIT_DIR/*.conf 2>/dev/null; then
              echo "[revoke]   ${name} PRESENT_IN_UNIT_CONFIG"
            else
              echo "[revoke]   ${name} absent-from-unit-config"
            fi
          done

          echo "[revoke] === local env files present on host ==="
          for f in backend/.env backend/.env.local .env; do
            if [ -e "$f" ]; then echo "[revoke]   present: $f"; else echo "[revoke]   absent: $f"; fi
          done

          # Tighten the credential-bearing drop-in here as well as in deploy.yml, so the host
          # is safe even before the next deploy runs.
          if [ -e "$UNIT_DIR/smtp.conf" ]; then
            sudo chmod 600 "$UNIT_DIR/smtp.conf"
            stat -c '[revoke] smtp drop-in tightened -> %a %n' "$UNIT_DIR/smtp.conf"
          fi

          echo "[revoke] === session revocation ==="
          DATABASE_URL="sqlite:////var/lib/ai_study_platform/app.db" \
            backend/.venv/bin/python scripts/deploy/revoke_all_sessions.py
          echo "[revoke] done"
          REVOKEEOF
