# Actions 列表标题来自 push 时的 commit message。
# 为确保部署记录可读、可回档，提交信息请写清楚中文说明，例如：
#   - 优化登录注册页面样式
#   - 将资料库嵌入课程工作台
#   - 自动沉淀AI学习记录
# 回档时可根据 Actions 列表中的中文标题和 commit hash 找到目标版本。

name: 自动部署

# Deploy and certificate rehearsal both invoke Certbot on the same host. Queue
# them instead of cancelling an in-flight production deployment.
concurrency:
  group: production-certbot
  cancel-in-progress: false

# A display string, not shell — the message cannot execute here. But the
# workflow_dispatch payload has no `head_commit` at all, so without a fallback the
# title renders as a bare "部署：" and the Actions list loses the rollback anchor.
run-name: 部署：${{ github.event.head_commit.message || '手动触发' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The commit message is attacker-influenced on every push. A `run:` body is shell
      # SOURCE: GitHub substitutes `${{ }}` into the text *before* bash parses it, so a
      # backtick or `$( )` in the message executes on the runner. Pass it through `env`
      # instead — env values reach the process verbatim and are never parsed as shell.
      # No `${{ }}` may appear inside a `run:` body in this file; add it to `env` above.
      - name: 写入部署摘要
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          TRIGGER_ACTOR: ${{ github.actor }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "## 本次部署信息" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 分支：${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 提交说明：${COMMIT_MSG:-（无提交说明）}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 提交人：${TRIGGER_ACTOR:-未知}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 触发方式：${TRIGGER_EVENT:-未知}" >> "$GITHUB_STEP_SUMMARY"

      - name: 打印最近版本记录
        run: git log --oneline -5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check backend Python syntax
        run: python -m py_compile backend/*.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # The frontend is same-origin in production; a machine-local API origin in the built
      # artifact is a total outage and must never reach the server.
      - name: Guard production API origin
        working-directory: frontend
        run: npm run check:api-origin

      - name: Prepare SSH
        shell: bash
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
        run: |
          set -euo pipefail

          : "${TENCENT_HOST:?TENCENT_HOST secret is required}"
          : "${TENCENT_SSH_KEY:?TENCENT_SSH_KEY secret is required}"
          SSH_PORT="${SSH_PORT:-22}"

          # Strip trailing dot/port/path from host (e.g. root@ip → ip, ip:22 → ip)
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"
          HOST_CLEAN="${HOST_CLEAN%%/*}"
          echo "SSH target: $HOST_CLEAN port $SSH_PORT"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$TENCENT_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/tencent_deploy_key"
          chmod 600 "$HOME/.ssh/tencent_deploy_key"

          echo "Validating SSH private key format..."
          if ! ssh-keygen -y -f "$HOME/.ssh/tencent_deploy_key" >/dev/null 2>/tmp/ssh-keygen.err; then
            echo "SSH private key validation failed"
            cat /tmp/ssh-keygen.err || true
            exit 1
          fi
          echo "SSH private key format is valid"

          echo "Checking SSH connectivity..."
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/$HOST_CLEAN/$SSH_PORT" 2>/dev/null \
            && echo "SSH port reachable" \
            || echo "Warning: TCP check skipped or port unreachable (will retry via ssh-keyscan)"

          echo "Running ssh-keyscan..."
          SCAN_OK=false
          for attempt in 1 2 3; do
            echo "ssh-keyscan attempt $attempt/3"
            SCAN_FILE="$(mktemp)"
            if ssh-keyscan -T 20 -p "$SSH_PORT" -H "$HOST_CLEAN" >"$SCAN_FILE" 2>/tmp/ssh-keyscan.err; then
              cat "$SCAN_FILE" >> "$HOME/.ssh/known_hosts"
              rm -f "$SCAN_FILE"
              SCAN_OK=true
              break
            fi
            rm -f "$SCAN_FILE"
            echo "ssh-keyscan attempt $attempt failed"
            cat /tmp/ssh-keyscan.err || true
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          if [ "$SCAN_OK" != "true" ]; then
            echo "ssh-keyscan failed after 3 attempts. Check TENCENT_HOST / TENCENT_PORT / server SSH banner availability."
            echo "TENCENT_HOST is set: yes (length ${#TENCENT_HOST})"
            echo "Cleaned host: $HOST_CLEAN"
            echo "SSH_PORT: $SSH_PORT"
            echo "--- final ssh-keyscan stderr ---"
            cat /tmp/ssh-keyscan.err || true
            exit 1
          fi
          chmod 644 "$HOME/.ssh/known_hosts"
          echo "ssh-keyscan succeeded"

      - name: Remote disk preflight
        shell: bash
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
        run: |
          set -euo pipefail
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"
          SSH_PORT="${SSH_PORT:-22}"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -i "$HOME/.ssh/tencent_deploy_key" -p "$SSH_PORT" \
            "$TENCENT_USER@$HOST_CLEAN" 'bash -se' <<'PREFLIGHTEOF'
          set -euo pipefail
          echo "=== remote disk preflight ==="
          df -h /
          df -i /
          # Remove only stale deployment scratch files. Persistent databases,
          # backups, uploads, and the repository are outside this cleanup.
          find /tmp -maxdepth 1 -type f \( \
            -name 'ai_study_platform-*' -o -name 'exercism_sources-*' \
          \) -mmin +60 -print -delete
          find /tmp -maxdepth 1 -type d -name 'tmp.*' -mmin +60 -print -exec rm -rf -- {} +
          npm cache clean --force || true
          sudo journalctl --vacuum-size=200M || true
          # ── APPLICATION ROOT (resolved, never hardcoded) ──
          # The running unit's WorkingDirectory is the single source of truth for which
          # tree is serving traffic, so this follows the Stage 5B move instead of pinning
          # a path that would keep operating on the tree the move left behind. It is
          # duplicated verbatim in the deploy heredoc below; keep the two in step.
          APP_WD="$(sudo systemctl show ai-backend -p WorkingDirectory --value 2>/dev/null || true)"
          if [ -n "${APP_WD:-}" ] && [ "$APP_WD" != "-" ] && [ -d "$APP_WD" ]; then
            APP_ROOT="${APP_WD%/backend}"
          else
            APP_ROOT="$HOME/ai_study_platform"
          fi
          # Keep the three newest catalog-reform database copies in each
          # explicitly managed backup directory. The live database, deploy
          # backups, uploads, and all other backup names are never touched.
          for BACKUP_ROOT in \
            "$APP_ROOT/backend/backups" \
            "/var/lib/ai_study_platform/backups"; do
            if [ -d "$BACKUP_ROOT" ]; then
              mapfile -t STALE_CATALOG_BACKUPS < <(
                find "$BACKUP_ROOT" -maxdepth 1 -type f \
                  -name 'app.db.before-catalog-reform.*.db' \
                  -printf '%T@ %p\n' | sort -nr | tail -n +4 | cut -d' ' -f2-
              )
              for OLD_BACKUP in "${STALE_CATALOG_BACKUPS[@]}"; do
                if [ -n "$OLD_BACKUP" ] && [ -f "$OLD_BACKUP" ]; then
                  echo "[preflight] removing stale catalog backup: $OLD_BACKUP"
                  rm -- "$OLD_BACKUP"
                fi
              done
            fi
          done
          if git -C "$APP_ROOT" rev-parse --git-dir >/dev/null 2>&1; then
            echo "[preflight] compacting unreachable Git objects"
            git -C "$APP_ROOT" gc --prune=now
          fi
          AVAIL_KB="$(df -Pk / | awk 'NR==2 {print $4}')"
          INODES_AVAIL="$(df -Pi / | awk 'NR==2 {print $4}')"
          if [ "${AVAIL_KB:-0}" -lt 3145728 ]; then
            echo "ERROR: less than 3 GiB available before deployment; refusing to upload or migrate"
            exit 1
          fi
          if [ "${AVAIL_KB:-0}" -lt 5242880 ]; then
            echo "WARNING: less than 5 GiB available before deployment"
          fi
          if [ "${INODES_AVAIL:-0}" -lt 10000 ]; then
            echo "ERROR: fewer than 10000 inodes available before deployment"
            exit 1
          fi
          echo "remote disk preflight passed"
          PREFLIGHTEOF

      - name: Create deployment Git bundle
        run: git bundle create "$RUNNER_TEMP/ai_study_platform.bundle" main

      - name: Create deployment source archive
        shell: bash
        run: git archive --format=tar main | gzip -n > "$RUNNER_TEMP/ai_study_platform.tar.gz"

      - name: Deploy to Tencent Cloud
        shell: bash
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          DATA_PLANE_WRITE_ENABLED: ${{ vars.DATA_PLANE_WRITE_ENABLED || 'false' }}
        run: |
          set -euo pipefail

          : "${TENCENT_HOST:?TENCENT_HOST secret is required}"
          : "${TENCENT_USER:?TENCENT_USER secret is required}"
          SSH_PORT="${SSH_PORT:-22}"
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"

          DEPLOY_BUNDLE="/tmp/ai_study_platform-${GITHUB_SHA}.bundle"
          DEPLOY_ARCHIVE="/tmp/ai_study_platform-${GITHUB_SHA}.tar.gz"
          echo "[deploy] Uploading Git bundle to $HOST_CLEAN:$DEPLOY_BUNDLE"
          scp -i "$HOME/.ssh/tencent_deploy_key" -P "$SSH_PORT" \
            "$RUNNER_TEMP/ai_study_platform.bundle" \
            "$TENCENT_USER@$HOST_CLEAN:$DEPLOY_BUNDLE"
          echo "[deploy] Uploading source archive to $HOST_CLEAN:$DEPLOY_ARCHIVE"
          scp -i "$HOME/.ssh/tencent_deploy_key" -P "$SSH_PORT" \
            "$RUNNER_TEMP/ai_study_platform.tar.gz" \
            "$TENCENT_USER@$HOST_CLEAN:$DEPLOY_ARCHIVE"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i "$HOME/.ssh/tencent_deploy_key" -p "$SSH_PORT" "$TENCENT_USER@$HOST_CLEAN" \
            DEPLOY_BUNDLE="$DEPLOY_BUNDLE" \
            DEPLOY_ARCHIVE="$DEPLOY_ARCHIVE" \
            SMTP_HOST="${SMTP_HOST:-}" \
            SMTP_PORT="${SMTP_PORT:-}" \
            SMTP_USER="${SMTP_USER:-}" \
            SMTP_PASSWORD="${SMTP_PASSWORD:-}" \
            SMTP_FROM="${SMTP_FROM:-}" \
            DATA_PLANE_WRITE_ENABLED="${DATA_PLANE_WRITE_ENABLED:-false}" \
            'bash -se' <<'DEPLOYEOF'
          set -euo pipefail

          DEPLOY_LOG="/tmp/ai-study-platform-deploy.log"
          DEPLOY_DIAGNOSTIC="/var/www/ai_study_platform/assets/deploy-diagnostic.txt"
          exec > >(tee "$DEPLOY_LOG") 2>&1
          deployment_exit() {
            local rc=$?
            if [ "$rc" -ne 0 ]; then
              sudo mkdir -p "$(dirname "$DEPLOY_DIAGNOSTIC")" || true
              {
                echo "exit_code=$rc"
                echo "last_command=${BASH_COMMAND}"
                echo "--- recent deployment output ---"
                tail -n 120 "$DEPLOY_LOG" || true
              } | sudo tee "$DEPLOY_DIAGNOSTIC" >/dev/null || true
            else
              sudo rm -f "$DEPLOY_DIAGNOSTIC" || true
            fi
            exit "$rc"
          }
          trap deployment_exit EXIT

          # ── APPLICATION ROOT (resolved, never hardcoded) ──
          # Same rule as the preflight block above: the unit's WorkingDirectory decides which
          # tree this deploy owns. Stage 5B moves the tree by updating that one unit field,
          # so every path derived from here follows the move with no second edit to make and
          # none to forget. `REPO_ROOT` is the only name used below.
          APP_WD="$(sudo systemctl show ai-backend -p WorkingDirectory --value 2>/dev/null || true)"
          if [ -n "${APP_WD:-}" ] && [ "$APP_WD" != "-" ] && [ -d "$APP_WD" ]; then
            APP_ROOT="${APP_WD%/backend}"
          else
            APP_ROOT="$HOME/ai_study_platform"
          fi
          REPO_ROOT="$APP_ROOT"
          echo "[deploy] application root: $REPO_ROOT (unit WorkingDirectory: ${APP_WD:-unset})"
          cd "$REPO_ROOT"

          # ── DEPLOY_SAFETY 1/5: ROLLBACK ANCHORS, taken BEFORE anything is replaced ──
          # The running release has to be restorable without depending on the network or on
          # the branch still pointing at it, so the source tree is archived out of band and the
          # live frontend build is copied aside. Both live in $HOME, NOT in the repo, so the
          # --delete rsync further down cannot reach them.
          #
          # This must happen first: the very next thing the deploy does is replace the source
          # tree, and `git reset --hard` erases the revision that is currently serving traffic.
          ROLLBACK_DIR="$HOME/.deploy_rollback"
          mkdir -p "$ROLLBACK_DIR"
          ROLLBACK_STAMP="$(date +%Y%m%d_%H%M%S)"
          PREVIOUS_REVISION="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          ROLLBACK_TAR="$ROLLBACK_DIR/source.$ROLLBACK_STAMP.tgz"
          tar czf "$ROLLBACK_TAR" -C "$REPO_ROOT" \
            --exclude=./.git --exclude=./backend/.venv --exclude=./backend/backups \
            --exclude=./backend/uploads --exclude=./backend/app.db --exclude=./backend/.env .
          echo "[deploy] rollback source anchor: $ROLLBACK_TAR ($(du -h "$ROLLBACK_TAR" | cut -f1)) revision=$PREVIOUS_REVISION"
          ROLLBACK_WWW="$ROLLBACK_DIR/www.$ROLLBACK_STAMP"
          if [ -d /var/www/ai_study_platform ]; then
            cp -a /var/www/ai_study_platform "$ROLLBACK_WWW"
            echo "[deploy] rollback frontend anchor: $ROLLBACK_WWW"
          fi
          # Keep the three newest anchors; they are megabytes, not gigabytes.
          find "$ROLLBACK_DIR" -maxdepth 1 -name 'source.*.tgz' -printf '%T@ %p\n' \
            | sort -nr | tail -n +4 | cut -d' ' -f2- | while read -r OLD; do rm -f "$OLD"; done
          find "$ROLLBACK_DIR" -maxdepth 1 -type d -name 'www.*' -printf '%T@ %p\n' \
            | sort -nr | tail -n +4 | cut -d' ' -f2- | while read -r OLD; do rm -rf "$OLD"; done

          # ── DEPLOY_SAFETY 2/5: the health gate, and the rollback it triggers ──
          # INTERNAL health only — the listener on loopback is the only address the backend
          # serves; the external probe stays on 443 (see the guard at the end of this file).
          wait_for_backend_health() {
            local attempts="${1:-30}" i
            for i in $(seq 1 "$attempts"); do
              if curl -fsS http://127.0.0.1:8000/health >/dev/null; then return 0; fi
              sleep 2
            done
            return 1
          }

          # Restore the release that was serving traffic when this deploy started, and prove it
          # is serving again. The restore is deliberately the MIRROR of the forward path — the
          # same rsync and the same excludes — rather than a hand-written list of directories,
          # because a list that misses one file leaves a half-old tree that is worse than either
          # release. .git / .venv / backups / uploads / .env / app.db are never touched.
          rollback_to_previous_release() {
            echo "[deploy] ROLLBACK: restoring the previous release (revision $PREVIOUS_REVISION)"
            sudo systemctl stop ai-backend || true
            if [ -f "$ROLLBACK_TAR" ]; then
              local stage
              stage="$(mktemp -d)"
              tar xzf "$ROLLBACK_TAR" -C "$stage"
              rsync -a --delete --exclude='.git/' --exclude='backend/app.db' \
                --exclude='backend/.env' --exclude='backend/.venv/' \
                --exclude='/backend/backups' --exclude='/backend/uploads' \
                "$stage/" "$REPO_ROOT/"
              rm -rf "$stage"
              echo "[deploy] ROLLBACK: source restored from $ROLLBACK_TAR"
            else
              echo "[deploy] ROLLBACK: no source anchor — cannot restore the code automatically"
            fi
            if [ -d "$ROLLBACK_WWW" ]; then
              sudo rm -rf /var/www/ai_study_platform
              sudo mv "$ROLLBACK_WWW" /var/www/ai_study_platform
              echo "[deploy] ROLLBACK: frontend build restored"
            fi
            sudo systemctl start ai-backend || true
            if wait_for_backend_health 30; then
              echo "[deploy] ROLLBACK: the PREVIOUS release is serving again (health ok)"
              echo "[deploy] ROLLBACK: this deployment FAILED; production was NOT left down"
              return 0
            fi
            echo "[deploy] ROLLBACK: previous release came back UNHEALTHY — manual attention required"
            sudo journalctl -u ai-backend -n 80 --no-pager || true
            return 1
          }

          export GIT_TERMINAL_PROMPT=0
          echo "[deploy] repository: $(pwd)"
          echo "[deploy] disk before git update"
          df -h /
          df -i /
          git remote -v
          echo "[deploy] Updating repository from uploaded Git bundle"
          if ! git -C "$REPO_ROOT" rev-parse --git-dir >/dev/null 2>&1; then
            # The release root is not a Git worktree — it was installed from a verified
            # source archive (the /opt layout). There is no .git to fetch into and no
            # previous checkout for `reset --hard`, so the archive IS the update path.
            # The bundle/clone recovery below must be skipped entirely, not merely fail:
            # it ends by moving "$DEPLOY_TREE/.git" into the release root, which would
            # abort the deploy on a tree that has no .git at all.
            echo "[deploy] $REPO_ROOT is not a Git worktree; syncing the source archive"
            DEPLOY_TREE="$(mktemp -d)"
            tar -xzf "$DEPLOY_ARCHIVE" -C "$DEPLOY_TREE"
            rsync -a --delete --exclude='.git/' --exclude='backend/app.db' --exclude='backend/.env' --exclude='backend/.venv/' --exclude='/backend/backups' --exclude='/backend/uploads' "$DEPLOY_TREE/" "$REPO_ROOT/"
            rm -rf "$DEPLOY_TREE"
          else
          GIT_FETCH_LOG="$(mktemp)"
          if git fetch "$DEPLOY_BUNDLE" main 2>&1 | tee "$GIT_FETCH_LOG"; then
            echo "[deploy] git fetch succeeded"
            git checkout main 2>&1 | tee -a "$GIT_FETCH_LOG"
            git reset --hard FETCH_HEAD 2>&1 | tee -a "$GIT_FETCH_LOG"
          else
            GIT_FETCH_STATUS=${PIPESTATUS[0]}
            echo "[deploy] git fetch failed with exit code $GIT_FETCH_STATUS"
            echo "[deploy] complete git stderr/stdout:"
            cat "$GIT_FETCH_LOG"
            rm -f "$GIT_FETCH_LOG"
            echo "[deploy] Existing Git worktree could not consume bundle; rebuilding it from the same bundle"
            DEPLOY_TREE=$(mktemp -d)
            if git clone "$DEPLOY_BUNDLE" "$DEPLOY_TREE" 2>&1 | tee "$REPO_ROOT/.git-clone.log"; then
              rsync -a --delete --exclude='.git/' --exclude='backend/app.db' --exclude='backend/.env' --exclude='backend/.venv/' --exclude='/backend/backups' --exclude='/backend/uploads' "$DEPLOY_TREE/" "$REPO_ROOT/"
              mv "$REPO_ROOT/.git" "$DEPLOY_TREE/.git.previous"
              mv "$DEPLOY_TREE/.git" "$REPO_ROOT/.git"
            else
              echo "[deploy] Bundle clone also failed; syncing the verified runner source archive"
              rm -rf "$DEPLOY_TREE"
              DEPLOY_TREE=$(mktemp -d)
              tar -xzf "$DEPLOY_ARCHIVE" -C "$DEPLOY_TREE"
              rsync -a --delete --exclude='.git/' --exclude='backend/app.db' --exclude='backend/.env' --exclude='backend/.venv/' --exclude='/backend/backups' --exclude='/backend/uploads' "$DEPLOY_TREE/" "$REPO_ROOT/"
            fi
            rm -rf "$DEPLOY_TREE"
          fi
          rm -f "$GIT_FETCH_LOG" "$REPO_ROOT/.git-clone.log"
          fi
          echo "[deploy] git update completed"
          rm -f "$DEPLOY_BUNDLE"
          rm -f "$DEPLOY_ARCHIVE"

          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
          fi

          if ! command -v gcc >/dev/null 2>&1 || ! command -v g++ >/dev/null 2>&1 || ! command -v cmake >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gcc g++ cmake
          fi

          JAVA_VERSION_OUTPUT="$(java -version 2>&1 || true)"
          JAVA_MAJOR="$(printf '%s\n' "$JAVA_VERSION_OUTPUT" | sed -n 's/.*version "\([0-9][0-9]*\).*/\1/p' | head -n 1)"
          if [ "${JAVA_MAJOR:-0}" -lt 21 ]; then
            echo "[deploy] Java 21 is required; trying the system package"
            sudo apt-get update
            sudo apt-get install -y openjdk-21-jdk-headless || true
            JAVA_VERSION_OUTPUT="$(java -version 2>&1 || true)"
            JAVA_MAJOR="$(printf '%s\n' "$JAVA_VERSION_OUTPUT" | sed -n 's/.*version "\([0-9][0-9]*\).*/\1/p' | head -n 1)"
          fi
          if [ "${JAVA_MAJOR:-0}" -lt 21 ]; then
            echo "[deploy] System repositories do not provide Java 21; installing Temurin 21"
            sudo apt-get update
            sudo apt-get install -y curl ca-certificates tar
            JAVA_ARCHIVE="/tmp/temurin-21-linux-x64.tar.gz"
            curl -fsSL "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse" -o "$JAVA_ARCHIVE"
            JAVA_HOME_21="/opt/temurin-21"
            sudo rm -rf "$JAVA_HOME_21"
            sudo mkdir -p "$JAVA_HOME_21"
            sudo tar -xzf "$JAVA_ARCHIVE" --strip-components=1 -C "$JAVA_HOME_21"
            sudo ln -sfn "$JAVA_HOME_21/bin/java" /usr/local/bin/java
            sudo ln -sfn "$JAVA_HOME_21/bin/javac" /usr/local/bin/javac
            export JAVA_HOME="$JAVA_HOME_21"
            export PATH="$JAVA_HOME_21/bin:$PATH"
            rm -f "$JAVA_ARCHIVE"
            JAVA_VERSION_OUTPUT="$(java -version 2>&1 || true)"
            JAVA_MAJOR="$(printf '%s\n' "$JAVA_VERSION_OUTPUT" | sed -n 's/.*version "\([0-9][0-9]*\).*/\1/p' | head -n 1)"
          fi
          if [ "${JAVA_MAJOR:-0}" -lt 21 ]; then
            echo "[deploy] Java 21 installation failed"
            printf '%s\n' "$JAVA_VERSION_OUTPUT"
            exit 1
          fi
          if ! command -v gradle >/dev/null 2>&1; then
            echo "[deploy] Gradle is required for audited Java exercises"
            sudo apt-get update
            sudo apt-get install -y curl unzip
            GRADLE_VERSION="8.10.2"
            GRADLE_ARCHIVE="/tmp/gradle-${GRADLE_VERSION}-bin.zip"
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "$GRADLE_ARCHIVE"
            sudo rm -rf "/opt/gradle-${GRADLE_VERSION}"
            sudo unzip -q "$GRADLE_ARCHIVE" -d /opt
            sudo ln -sfn "/opt/gradle-${GRADLE_VERSION}/bin/gradle" /usr/local/bin/gradle
            rm -f "$GRADLE_ARCHIVE"
          fi
          echo "=== Java toolchain ==="
          java -version
          javac -version
          gradle -version

          echo "=== 安装后端Python依赖 ==="
          if [ -x "backend/.venv/bin/pip" ]; then
            echo "[deploy] 使用 backend/.venv/bin/pip"
            backend/.venv/bin/pip install -r backend/requirements.txt
          elif [ -x ".venv/bin/pip" ]; then
            echo "[deploy] 使用 .venv/bin/pip"
            .venv/bin/pip install -r backend/requirements.txt
          elif [ -x "venv/bin/pip" ]; then
            echo "[deploy] 使用 venv/bin/pip"
            venv/bin/pip install -r backend/requirements.txt
          else
            echo "[deploy] 未找到虚拟环境，使用系统 python3"
            python3 -m pip install -r backend/requirements.txt
          fi
          if [ -x "backend/.venv/bin/python" ]; then
            PYTHON_BIN="$REPO_ROOT/backend/.venv/bin/python"
          elif [ -x ".venv/bin/python" ]; then
            PYTHON_BIN="$REPO_ROOT/.venv/bin/python"
          elif [ -x "venv/bin/python" ]; then
            PYTHON_BIN="$REPO_ROOT/venv/bin/python"
          else
            PYTHON_BIN="$(command -v python3)"
          fi
          echo "[deploy] Python runtime: $PYTHON_BIN"
          echo "=== 依赖安装完成 ==="

          cd frontend
          npm ci
          npm run build
          cd ..

          # ── DEPLOY_SAFETY 3/5: NO STOP HERE ──
          # Everything from this point to the health-gated switch runs against the LIVE database
          # while the CURRENT release keeps serving. That is safe because the schema policy is
          # additive-only (CREATE TABLE IF NOT EXISTS / ALTER TABLE ADD COLUMN / CREATE INDEX IF
          # NOT EXISTS), so already-running code keeps working against a migrated schema.
          #
          # The frontend build is also deliberately NOT published yet: a new bundle in front of
          # an unvalidated backend is how a failed deploy ends up half-shipped.
          sudo mkdir -p /var/www/ai_study_platform

          # ── Persistent database outside git worktree ──
          sudo mkdir -p /var/lib/ai_study_platform
          # Create the two app-written subdirectories BEFORE the permission pass, so a
          # fresh host gets them setgid + group-write from the same code path instead of
          # inheriting whatever root's umask produced.
          sudo mkdir -p /var/lib/ai_study_platform/backups /var/lib/ai_study_platform/uploads
          DATA_DB=/var/lib/ai_study_platform/app.db
          CATALOG_BACKUP=""
          if [ -f backend/app.db ] && [ ! -f "$DATA_DB" ]; then
            echo "[deploy] 首次部署：迁移本地 app.db 到持久目录"
            cp backend/app.db "$DATA_DB"
          fi
          # ── Shared mutable state: owner preserved, group zhixue-app, group-write ──
          # This replaced a blanket `chown -R ubuntu:ubuntu` + `chmod 755`. That pair did
          # two harmful things on every deploy: it reassigned ownership of learner uploads
          # and of the live database, and it left the tree world-traversable so an unrelated
          # service account could open production data. The script below is idempotent and
          # is also what the Stage 5A drill exercises, so the tested behaviour and the
          # deployed behaviour cannot drift apart.
          # sudo: the script chgrps the WHOLE tree, and the tree legitimately contains
          # root-owned files (the catalog snapshots are created with `sudo sqlite3 .backup`;
          # the /opt layout is root-installed). A non-root run dies on the first file the
          # deploy account does not own — measured 2026-10-08, when the root-owned snapshot
          # from the previous release failed the deploy exactly there, before the switch.
          sudo bash "$REPO_ROOT/deploy/enforce_shared_state.sh" /var/lib/ai_study_platform zhixue-app
          # PREFLIGHT (read only). This gate asks its question against the live database BEFORE
          # anything is stopped, so a refusal costs the deployment nothing and production keeps
          # serving. Its late position is exactly what turned a data bug into a 15-minute outage
          # on 2026-09-28: the old release had already been stopped when this first ran.
          echo "=== Membership mapping precheck (read only; current release still serving) ==="
          if ! DATABASE_URL="sqlite:///$DATA_DB" "$PYTHON_BIN" \
               scripts/deploy/check_membership_mapping.py; then
            echo "[deploy] ERROR: unmappable legacy membership state."
            echo "[deploy]        NOTHING was written and NOTHING was stopped — the running"
            echo "[deploy]        release is still serving. Repair the listed rows (see"
            echo "[deploy]        scripts/deploy/repair_legacy_plan.py), then redeploy."
            exit 1
          fi
          # A catalog migration must never run without a recoverable snapshot.
          if [ -f "$DATA_DB" ]; then
            # Snapshots belong with the rest of the mutable state, not inside the release
            # tree: the tree is replaced on every deploy, and a snapshot that a `rsync
            # --delete` can remove is not a rollback anchor.
            CATALOG_BACKUP_DIR="/var/lib/ai_study_platform/backups"
            mkdir -p "$CATALOG_BACKUP_DIR"
            CATALOG_BACKUP="$CATALOG_BACKUP_DIR/app.db.before-catalog-reform.$(date +%Y%m%d_%H%M%S).db"
            # `.backup` is the ONLINE-safe snapshot. The service is still running here, and a
            # plain `cp` of a live SQLite file can capture a torn page — this is the same
            # primitive the operator repair workflows use against production.
            if ! sudo sqlite3 "$DATA_DB" ".timeout 5000" ".backup '$CATALOG_BACKUP'"; then
              echo "[deploy] ERROR: catalog database backup failed"
              exit 1
            fi
            # `sqlite3` ran as root, so this file needs the shared group and its write bit
            # explicitly. A `chown` to the deploy account — what this line used to do —
            # would strip the group the shared-state model depends on.
            sudo chgrp zhixue-app "$CATALOG_BACKUP" 2>/dev/null || true
            sudo chmod 0660 "$CATALOG_BACKUP" 2>/dev/null || true
            test -s "$CATALOG_BACKUP" || { echo "[deploy] ERROR: catalog database backup is empty"; exit 1; }
            echo "[deploy] Catalog database backup: $CATALOG_BACKUP ($(du -h "$CATALOG_BACKUP" | cut -f1))"
            # A new automatic snapshot was just created. Retain the newest
            # three automatic catalog-reform backups in each managed folder;
            # milestone backups with other names are never touched.
            for BACKUP_ROOT in \
              "$CATALOG_BACKUP_DIR" \
              "$REPO_ROOT/backend/backups"; do
              if [ -d "$BACKUP_ROOT" ]; then
                mapfile -t STALE_CATALOG_BACKUPS < <(
                  find "$BACKUP_ROOT" -maxdepth 1 -type f \
                    -name 'app.db.before-catalog-reform.*.db' \
                    -printf '%T@ %p\n' | sort -nr | tail -n +4 | cut -d' ' -f2-
                )
                for OLD_BACKUP in "${STALE_CATALOG_BACKUPS[@]}"; do
                  if [ -n "$OLD_BACKUP" ] && [ -f "$OLD_BACKUP" ]; then
                    echo "[deploy] removing stale automatic catalog backup: $OLD_BACKUP"
                    rm -- "$OLD_BACKUP"
                  fi
                done
              fi
            done
            if ! sudo sqlite3 "$DATA_DB" 'PRAGMA integrity_check;' | grep -qx 'ok'; then
              echo "[deploy] ERROR: persistent database integrity_check failed"
              exit 1
            fi
            echo "[deploy] Persistent database integrity_check: ok"
          fi
          echo "[deploy] Persistent DB at $DATA_DB"

          # ── ACCEL_SPRINT_S6 PART A: migrate BEFORE the application starts ──
          # The application refuses to start on a database that is behind HEAD
          # (backend/core/schema_preflight.py), and SQLAlchemy's create_all can never
          # repair one: it does not add columns to a table that already exists. So this is
          # not optional and cannot be deferred past the restart below.
          #
          # DEPLOY_SAFETY: it runs while the CURRENT release is still serving. Safe because the
          # schema policy is additive-only; the membership gate that guards it already ran
          # above, before anything was stopped.
          if [ -n "${CATALOG_BACKUP:-}" ]; then
            test -s "$CATALOG_BACKUP" || {
              echo "[deploy] ERROR: refusing to migrate without a non-empty backup"
              exit 1
            }
            echo "[deploy] Migration proceeds under backup: $CATALOG_BACKUP"
          else
            echo "[deploy] No existing database to back up; the migration starts a new one"
          fi

          cd "$REPO_ROOT"
          MIGRATION_LOG="/var/lib/ai_study_platform/backups/migration.$(date +%Y%m%d_%H%M%S).log"
          mkdir -p "$(dirname "$MIGRATION_LOG")"

          echo "=== alembic upgrade head ==="
          set +e
          DATABASE_URL="sqlite:///$DATA_DB" "$PYTHON_BIN" -m alembic -c alembic.ini \
            upgrade head 2>&1 | tee "$MIGRATION_LOG"
          MIGRATION_RC="${PIPESTATUS[0]}"
          set -e
          if [ "$MIGRATION_RC" -ne 0 ]; then
            echo "[deploy] ERROR: alembic upgrade head failed (rc=$MIGRATION_RC)"
            echo "[deploy] The application has NOT been started."
            echo "[deploy] Migration log: $MIGRATION_LOG"
            echo "[deploy] Restore from the verified pre-migration backup before retrying:"
            echo "[deploy]   ${CATALOG_BACKUP:-<no backup was taken — the database did not exist>}"
            exit 1
          fi
          echo "[deploy] Migration log: $MIGRATION_LOG"

          # An Alembic exit code is not evidence that the schema the APPLICATION needs is
          # present — it is evidence that the revision chain ran. The preflight re-reads
          # the database and answers the deployment's actual question.
          echo "=== Verifying schema revision after migration ==="
          if ! DATABASE_URL="sqlite:///$DATA_DB" "$PYTHON_BIN" scripts/deploy/check_schema.py; then
            echo "[deploy] ERROR: schema check failed after migration; not starting app"
            exit 1
          fi
          if ! sudo sqlite3 "$DATA_DB" 'PRAGMA integrity_check;' | grep -qx 'ok'; then
            echo "[deploy] ERROR: integrity_check failed after migration; not starting app"
            exit 1
          fi
          echo "[deploy] Post-migration integrity_check: ok"

          # ── Configure persistent database for systemd service ──
          sudo mkdir -p /etc/systemd/system/ai-backend.service.d
          sudo tee /etc/systemd/system/ai-backend.service.d/database.conf > /dev/null <<INNEREOF
          [Service]
          Environment="DATABASE_URL=sqlite:////var/lib/ai_study_platform/app.db"
          INNEREOF
          sudo systemctl daemon-reload
          echo "[deploy] DATABASE_URL configured"

          # ── Configure DATA_PLANE_WRITE_ENABLED for systemd service (fail-closed) ──
          DP_WRITE="false"
          if [ "${DATA_PLANE_WRITE_ENABLED:-}" = "true" ]; then
            DP_WRITE="true"
          fi
          echo "[deploy] DATA_PLANE_WRITE_ENABLED=${DP_WRITE}"
          sudo mkdir -p /etc/systemd/system/ai-backend.service.d
          sudo tee /etc/systemd/system/ai-backend.service.d/data-plane.conf > /dev/null <<INNEREOF
          [Service]
          Environment="DATA_PLANE_WRITE_ENABLED=${DP_WRITE}"
          INNEREOF
          sudo systemctl daemon-reload

          # ── SECURITY_NETWORK_BACKEND_PERIMETER: bind the backend to loopback ──
          # The base ai-backend.service is provisioned on the host and is NOT in this
          # repository; it starts uvicorn with `--host 0.0.0.0`, which made the API
          # reachable directly from the internet on :8000 — bypassing nginx, TLS, the
          # HTTP→HTTPS redirect, the security headers and client_max_body_size. nginx
          # already proxies to 127.0.0.1:8000 for every location, so pinning the listener
          # to loopback removes only the unsupported path.
          #
          # The override is derived from the unit's OWN current ExecStart rather than
          # hardcoded here: the interpreter path, module and venv belong to the host's
          # definition of how the app starts, and re-deriving them on every deploy means
          # this cannot silently drift from it. ExecStart accumulates across drop-ins, so
          # it must be cleared before it can be redefined.
          BASE_EXEC="$(sudo systemctl cat ai-backend | grep -m1 '^ExecStart=' || true)"
          if [ -z "$BASE_EXEC" ]; then
            echo "[deploy] ERROR: ai-backend has no ExecStart to derive a loopback bind from"
            exit 1
          fi
          case "$BASE_EXEC" in
            *"--host 127.0.0.1"*)
              LOOPBACK_EXEC="$BASE_EXEC"
              echo "[deploy] ai-backend already binds loopback" ;;
            *"--host 0.0.0.0"*)
              LOOPBACK_EXEC="${BASE_EXEC/--host 0.0.0.0/--host 127.0.0.1}"
              echo "[deploy] rewriting the wildcard bind to loopback" ;;
            *)
              echo "[deploy] ERROR: unexpected ExecStart host; refusing to guess a bind:"
              echo "[deploy]        $BASE_EXEC"
              exit 1 ;;
          esac
          # ── Cross-check the derived interpreter against the release it must serve ──
          # `systemctl cat` prints the BASE unit first, so BASE_EXEC comes from the host's
          # own unit definition — not from a drop-in. That is the right source, but it means
          # this line can PIN A FOREIGN TREE: if the base unit still names the old directory
          # after the release moved, the drop-in written below would restart the OLD code
          # while every other step of this deploy updated the new one. Moving the release
          # therefore has to update the base unit, and this gate makes the failure loud
          # instead of silent.
          case "$LOOPBACK_EXEC" in
            *"$REPO_ROOT/"*) ;;
            *)
              echo "[deploy] ERROR: ai-backend's ExecStart does not point into the release"
              echo "[deploy]        this deploy owns, so pinning the bind would restart a"
              echo "[deploy]        different tree than the one just updated."
              echo "[deploy]        release root : $REPO_ROOT"
              echo "[deploy]        unit ExecStart: $LOOPBACK_EXEC"
              echo "[deploy]        Update the BASE unit (/etc/systemd/system/ai-backend.service)"
              echo "[deploy]        to the new WorkingDirectory/ExecStart, then redeploy."
              exit 1 ;;
          esac
          sudo tee /etc/systemd/system/ai-backend.service.d/loopback-bind.conf > /dev/null <<INNEREOF
          # SECURITY_NETWORK_BACKEND_PERIMETER — written by .github/workflows/deploy.yml.
          # The API must not be reachable except through nginx on this same host.
          [Service]
          ExecStart=
          ${LOOPBACK_EXEC}
          INNEREOF
          sudo chmod 644 /etc/systemd/system/ai-backend.service.d/loopback-bind.conf
          sudo systemctl daemon-reload
          if ! sudo systemctl show -p ExecStart --value ai-backend | grep -q -- '--host 127.0.0.1'; then
            echo "[deploy] ERROR: the loopback bind did not take effect, so the API would stay"
            echo "[deploy]        reachable from the internet. Not starting the application."
            sudo systemctl show -p ExecStart ai-backend || true
            exit 1
          fi
          echo "[deploy] Backend pinned to 127.0.0.1 (public :8000 closed at the listener)"

          # ── UMask: how the service's own files are born ──
          # SQLite does not inherit the mode of an existing WAL — it CREATES `app.db-wal`
          # and `app.db-shm` whenever it needs them, with mode 0666 & ~umask. Under the
          # default umask 022 that is 0644: readable but not writable by the shared group,
          # so the moment the service runs as a different identity than the one that
          # created them (which is exactly what the Stage 5B cutover does) SQLite cannot
          # write its own WAL. umask 0007 produces 0660, and the setgid directories in
          # /var/lib give the file the right group — so the pair "service umask + setgid
          # dir" is what keeps the database usable across an identity change.
          sudo mkdir -p /etc/systemd/system/ai-backend.service.d
          sudo tee /etc/systemd/system/ai-backend.service.d/umask.conf > /dev/null <<INNEREOF
          [Service]
          # SECURITY_S0B-P1: keep service-created files inside the shared group.
          UMask=0007
          INNEREOF
          sudo chmod 644 /etc/systemd/system/ai-backend.service.d/umask.conf
          sudo systemctl daemon-reload
          echo "[deploy] service UMask=0007 (new WAL/SHM are group-writable, never world-readable)"

          # ── Retire the ADMIN_LOGIN_CODE drop-in ──
          # SECURITY_S0.5: ADMIN_LOGIN_CODE has no reader anywhere in the backend — no
          # admin authentication path depends on it. It was a dead secret kept in a
          # world-readable drop-in, so provisioning is removed and any drop-in left on
          # the host by an earlier deploy is deleted here rather than merely orphaned.
          if sudo test -e /etc/systemd/system/ai-backend.service.d/admin-code.conf; then
            sudo rm -f /etc/systemd/system/ai-backend.service.d/admin-code.conf
            echo "[deploy] removed obsolete admin-code.conf drop-in"
          fi

          # ── Configure SMTP for systemd service ──
          if [ -n "${SMTP_HOST:-}" ] && [ -n "${SMTP_USER:-}" ] && [ -n "${SMTP_PASSWORD:-}" ]; then
            echo "[deploy] Configuring SMTP in systemd drop-in..."
            sudo mkdir -p /etc/systemd/system/ai-backend.service.d
            sudo tee /etc/systemd/system/ai-backend.service.d/smtp.conf > /dev/null <<INNEREOF
          [Service]
          Environment="SMTP_HOST=${SMTP_HOST}"
          Environment="SMTP_PORT=${SMTP_PORT:-587}"
          Environment="SMTP_USER=${SMTP_USER}"
          Environment="SMTP_PASSWORD=${SMTP_PASSWORD}"
          Environment="SMTP_FROM=${SMTP_FROM:-${SMTP_USER}}"
          INNEREOF
          # SECURITY_S0.5: this drop-in holds the SMTP credential. `tee` inherits the
          # umask (typically 022 → 0644, world-readable) and does NOT tighten the mode
          # of a file it already found, so an earlier deploy left the password readable
          # by every local user. Force it explicitly on every deploy.
            sudo chmod 600 /etc/systemd/system/ai-backend.service.d/smtp.conf
            sudo systemctl daemon-reload
            echo "[deploy] SMTP configured via systemd drop-in (mode 0600)"
          else
            echo "[deploy] SMTP secrets not fully configured — skipping email service"
          fi

          sudo systemctl daemon-reload
          echo "=== 章节题库导入(持久DB, 不阻塞服务) ==="
          cd backend
          # The legacy online importer remains in the file for rollback
          # reference but is intentionally disabled.  The audited snapshot is
          # the only programming-catalog input for this deployment.
          if false; then
          echo "=== Importing audited Exercism programming exercises ==="
          EXERCISM_SOURCE_ROOT=$(mktemp -d)
          tar -xzf "$EXERCISM_ARCHIVE" -C "$EXERCISM_SOURCE_ROOT"
          DATABASE_URL="sqlite:///$DATA_DB" .venv/bin/python scripts/import_exercism_exercises.py \
            --source-root "$EXERCISM_SOURCE_ROOT" \
            --languages C \
            --slugs hello-world,reverse-string,acronym,bob,difference-of-squares,grains,leap,binary,collatz-conjecture,darts,dnd-character,eliuds-eggs,hamming,queen-attack,raindrops,resistor-color-duo,rna-transcription,space-age,two-fer,armstrong-numbers,binary-search,gigasecond,high-scores \
            --max-per-language 23
          DATABASE_URL="sqlite:///$DATA_DB" .venv/bin/python scripts/import_exercism_exercises.py \
            --source-root "$EXERCISM_SOURCE_ROOT" \
            --languages C++ \
            --slugs hello-world,reverse-string,acronym,bob,election-day,ellens-alien-game,freelancer-rates,interest-is-interesting,isbn-verifier,lasagna,lasagna-master,last-will,log-levels,luhn,making-the-grade,pacman-rules,power-of-troy,space-age,speedywagon,troll-the-trolls,collatz-conjecture,darts,grains \
            --max-per-language 23
          DATABASE_URL="sqlite:///$DATA_DB" .venv/bin/python scripts/import_exercism_exercises.py \
            --source-root "$EXERCISM_SOURCE_ROOT" \
            --languages Python \
            --slugs ledger,markdown,bob,hello-world,reverse-string,acronym,anagram,armstrong-numbers,binary-search,black-jack,card-games,cater-waiter,chaitanas-colossal-coaster,collatz-conjecture,currency-exchange,darts,difference-of-squares,electric-bill,ellens-alien-game,etl,flatten-array,ghost-gobble-arcade-game,gigasecond,grains,word-count \
            --max-per-language 25
          DATABASE_URL="sqlite:///$DATA_DB" .venv/bin/python scripts/import_exercism_exercises.py \
            --source-root "$EXERCISM_SOURCE_ROOT" \
            --languages Java \
            --slugs hello-world,reverse-string,gigasecond,remote-control-competition,logs-logs-logs \
            --max-per-language 5
          echo "=== Importing first-party standard OJ pilot as needs_review/inactive ==="
          DATABASE_URL="sqlite:///$DATA_DB" .venv/bin/python scripts/seed_chinese_oj_pilot.py
          echo "=== Seeding verified 120-item recovery catalog (idempotent) ==="
          DATABASE_URL="sqlite:///$DATA_DB" .venv/bin/python scripts/seed_approved_120_catalog.py
          echo "=== Legacy full-catalog quarantine and 800 snapshot seed intentionally disabled ==="
          rm -rf "$EXERCISM_SOURCE_ROOT" "$EXERCISM_ARCHIVE"
          fi
          echo "=== Initialize database schema ==="
          DATABASE_URL="sqlite:///$DATA_DB" "$PYTHON_BIN" -c \
            'from database import engine; from database_schema import ensure_database_schema; print(ensure_database_schema(engine))'
          echo "=== Seed validated 240 programming catalog ==="
          DATABASE_URL="sqlite:///$DATA_DB" "$PYTHON_BIN" scripts/seed_validated_programming_catalog_240.py
          echo "=== Verify seeded catalog counts ==="
          DATABASE_URL="sqlite:///$DATA_DB" "$PYTHON_BIN" -c \
            'from database import SessionLocal; from models import ProgrammingExercise; db=SessionLocal(); rows=db.query(ProgrammingExercise).filter(ProgrammingExercise.is_active.is_(True), ProgrammingExercise.quality_status=="approved").all(); counts={language:sum(row.language==language for row in rows) for language in ("C","C++","Python","Java")}; print({"active_approved":len(rows),"counts":counts}); assert len(rows)==240 and counts=={"C":60,"C++":60,"Python":60,"Java":60}; db.close()'
          DATABASE_URL="sqlite:///$DATA_DB" "$PYTHON_BIN" exam_resources/11408/data_structure/chapter_questions/build_data_structure_chapter_questions.py || echo "[deploy] WARN: DS build failed"
          DATABASE_URL="sqlite:///$DATA_DB" "$PYTHON_BIN" exam_resources/11408/computer_organization/chapter_questions/build_computer_organization_chapter_questions.py || echo "[deploy] WARN: CO chapter build failed"
          DATABASE_URL="sqlite:///$DATA_DB" "$PYTHON_BIN" exam_resources/11408/computer_organization/past_papers/build_computer_organization_past_papers_text.py --apply || echo "[deploy] WARN: CO past papers build failed"
          DATABASE_URL="sqlite:///$DATA_DB" "$PYTHON_BIN" exam_resources/11408/operating_system/chapter_practice/build_operating_system_chapter_questions.py || echo "[deploy] WARN: OS chapter build failed"
          DATABASE_URL="sqlite:///$DATA_DB" "$PYTHON_BIN" exam_resources/11408/operating_system/past_papers/build_operating_system_past_papers.py || echo "[deploy] WARN: OS past papers build failed"
          DATABASE_URL="sqlite:///$DATA_DB" "$PYTHON_BIN" exam_resources/11408/computer_network/chapter_practice/build_computer_network_chapter_questions.py || echo "[deploy] WARN: CN chapter build failed"
          DATABASE_URL="sqlite:///$DATA_DB" "$PYTHON_BIN" exam_resources/11408/computer_network/past_papers/build_computer_network_past_papers.py || echo "[deploy] WARN: CN past papers build failed"
          cd ..

          # ── Immutable release tree: readable+executable by the web identity, writable by
          # nobody else ──
          # Runs after every writer (rsync, pip, npm) and before the restart, because
          # `rsync -a` restores the SOURCE modes (0644/0755) on every release — so
          # other-read, and with it the sandbox runner's ability to read the application
          # tree, comes back on every deploy unless it is stripped again here.
          # The legacy tree is deliberately exempt: it keeps its host-provisioned ownership
          # until Stage 5B retires it, and touching it now would only widen access.
          if [ "$REPO_ROOT" != "$HOME/ai_study_platform" ]; then
            # sudo for the same reason as enforce_shared_state.sh above: the release tree's
            # files are not all owned by the deploy account, and chgrp/chmod on a file the
            # caller does not own is refused.
            sudo bash "$REPO_ROOT/deploy/enforce_app_tree.sh" "$REPO_ROOT" zhixue-app
          else
            echo "[deploy] release root is the legacy tree; immutable-tree model not applied"
          fi

          # ── DEPLOY_SAFETY 4/5: THE SWITCH — the FIRST stop in the whole deployment ──
          # Everything above this line ran against a still-serving production. From here the
          # candidate takes the port, and a failure from here on triggers the rollback below
          # instead of leaving production down.
          echo "=== Switching to the candidate release ==="
          sudo systemctl restart ai-backend

          # INTERNAL_BACKEND_HEALTH — this reads the listener on loopback, which is the only
          # address the backend serves. It is deliberately NOT an external probe: the
          # EXTERNAL_NGINX_HEALTH check (public https://…/api/health) runs later, on the
          # runner, and covers nginx + TLS. Neither of them may be moved onto public :8000.
          echo "=== Waiting for backend health (internal, 127.0.0.1) ==="
          if wait_for_backend_health 30; then
            echo "[deploy] backend health ok"
          else
            echo "[deploy] ERROR: the candidate release did not become healthy after the switch"
            sudo systemctl status ai-backend --no-pager -l || true
            sudo journalctl -u ai-backend -n 80 --no-pager || true
            rollback_to_previous_release || true
            exit 1
          fi

          # ── DEPLOY_SAFETY 5/5: publish the frontend only now ──
          # The backend has answered /health on this release. Publishing the bundle any earlier
          # is how a failed deploy ends up serving new assets against a stopped API.
          sudo rsync -a --delete frontend/dist/ /var/www/ai_study_platform/
          echo "[deploy] frontend published"

          echo "=== Deploy Scientific Runtime Service (zhixue-runtime) ==="
          # The runtime closure ships as an immutable artifact under deploy/artifacts/
          # (SHA-verified before extraction). No prior host state is required.
          REPO_ROOT="$REPO_ROOT" bash "$REPO_ROOT/deploy/deploy-runtime-service.sh"

          echo "=== Verify Scientific Runtime Service health ==="
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8101/health >/dev/null; then
              echo "[deploy] zhixue-runtime health ok"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "[deploy] zhixue-runtime health failed"
              sudo systemctl status zhixue-runtime --no-pager -l || true
              sudo journalctl -u zhixue-runtime -n 80 --no-pager || true
              exit 1
            fi
            sleep 2
          done

          echo "=== Provisioning trusted HTTPS for public IP ==="
          AI_STUDY_REPO_ROOT="$REPO_ROOT" \
            AI_STUDY_PUBLIC_IP="101.32.190.42" \
            bash "$REPO_ROOT/scripts/deploy/configure_https.sh"

          echo "=== Enabling Secure auth cookies after HTTPS activation ==="
          sudo mkdir -p /etc/systemd/system/ai-backend.service.d
          sudo tee /etc/systemd/system/ai-backend.service.d/security.conf > /dev/null <<INNEREOF
          [Service]
          Environment="AI_SESSION_COOKIE_SECURE=true"
          Environment="APP_ENV=production"
          INNEREOF
          sudo systemctl daemon-reload
          sudo systemctl restart ai-backend

          echo "=== Verifying HTTPS and HTTP redirect ==="
          for i in {1..30}; do
            if curl -fsS --resolve 101.32.190.42:443:127.0.0.1 https://101.32.190.42/api/health >/dev/null; then
              echo "[deploy] HTTPS health ok"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "[deploy] HTTPS health failed after Secure cookie activation"
              sudo systemctl status ai-backend --no-pager -l || true
              sudo journalctl -u ai-backend -n 80 --no-pager || true
              # The switch already happened, so this is still a candidate failure: put the
              # previous release back rather than leaving production on a broken revision.
              rollback_to_previous_release || true
              exit 1
            fi
            sleep 2
          done
          REDIRECT_STATUS="$(curl -sS -o /dev/null --max-redirs 0 -w '%{http_code}' http://101.32.190.42/ || true)"
          REDIRECT_LOCATION="$(curl -sSI --max-redirs 0 http://101.32.190.42/ 2>/dev/null | awk 'tolower($1)=="location:" {print $2}' | tr -d '\r' || true)"
          case "$REDIRECT_STATUS" in
            301|302|307|308) ;;
            *) echo "[deploy] HTTP did not redirect to HTTPS: status=$REDIRECT_STATUS"; rollback_to_previous_release || true; exit 1;;
          esac
          case "$REDIRECT_LOCATION" in
            https://101.32.190.42/*) ;;
            *) echo "[deploy] HTTP redirect target is not HTTPS: $REDIRECT_LOCATION"; rollback_to_previous_release || true; exit 1;;
          esac
          echo "[deploy] HTTP redirect verified: $REDIRECT_STATUS -> $REDIRECT_LOCATION"

          echo "=== Verifying nginx health ==="
          for i in {1..10}; do
            curl -fsS --resolve 101.32.190.42:443:127.0.0.1 https://101.32.190.42/api/health >/dev/null
            sleep 1
          done
          echo "=== Final remote disk check ==="
          df -h /
          df -i /
          FINAL_AVAIL_KB="$(df -Pk / | awk 'NR==2 {print $4}')"
          if [ "${FINAL_AVAIL_KB:-0}" -lt 3145728 ]; then
            echo "[deploy] ERROR: less than 3 GiB remains after deployment"
            exit 1
          fi
          if [ "${FINAL_AVAIL_KB:-0}" -lt 5242880 ]; then
            echo "[deploy] WARNING: less than 5 GiB remains after deployment"
          fi
          DEPLOYEOF

      - name: Verify public HTTPS reachability
        shell: bash
        run: |
          set -euo pipefail
          echo "=== External HTTPS probe ==="
          for attempt in {1..6}; do
            if curl -fsS --max-time 20 https://101.32.190.42/api/health >/tmp/ai-study-platform-health.json; then
              echo "[deploy] public HTTPS /api/health=200"
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "[deploy] public HTTPS probe failed; port 443 may be blocked by a cloud firewall/security group"
              exit 1
            fi
            sleep 10
          done
          HTTP_STATUS="$(curl -sS -o /dev/null --max-redirs 0 -w '%{http_code}' --max-time 20 http://101.32.190.42/ || true)"
          test "$HTTP_STATUS" = "308" || { echo "[deploy] expected HTTP 308, got $HTTP_STATUS"; exit 1; }
          CERT_DETAILS="$(openssl s_client -connect 101.32.190.42:443 -servername 101.32.190.42 </dev/null 2>/dev/null | openssl x509 -noout -issuer -subject -dates -ext subjectAltName)"
          echo "$CERT_DETAILS"
          echo "$CERT_DETAILS" | grep -Eq 'IP Address:101\.32\.190\.42'
          echo "$CERT_DETAILS" | grep -qi "Let's Encrypt"
          rm -f /tmp/ai-study-platform-health.json

      # SECURITY_NETWORK_BACKEND_PERIMETER. The backend is pinned to 127.0.0.1, so this
      # probe must be refused from outside. It has to run here, on the runner: a check from
      # the host itself would reach 127.0.0.1 and pass no matter what the listener binds.
      # Nothing may be reopened on :8000 to satisfy a health check — the internal check
      # stays on loopback and the external smoke stays on 443 (the step above).
      - name: Guard backend is not publicly reachable
        shell: bash
        run: |
          set -euo pipefail
          echo "=== External :8000 exposure probe ==="
          for attempt in {1..6}; do
            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/101.32.190.42/8000" 2>/dev/null; then
              echo "[guard] attempt $attempt: public :8000 accepted a connection"
            else
              echo "[guard] public :8000 refused or blocked — loopback bind holds"
              exit 0
            fi
            sleep 5
          done
          echo "[guard] ERROR: public :8000 still accepts connections after deployment, so the"
          echo "[guard]        API is exposed without TLS, nginx security headers or the size cap."
          echo "[guard]        The wildcard bind is still in force; treat this release as failed."
          exit 1
