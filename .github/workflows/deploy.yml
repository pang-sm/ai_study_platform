# Actions 列表标题来自 push 时的 commit message。
# 为确保部署记录可读、可回档，提交信息请写清楚中文说明，例如：
#   - 优化登录注册页面样式
#   - 将资料库嵌入课程工作台
#   - 自动沉淀AI学习记录
# 回档时可根据 Actions 列表中的中文标题和 commit hash 找到目标版本。

name: 自动部署

run-name: 部署：${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: 写入部署摘要
        run: |
          echo "## 本次部署信息" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 分支：${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- 提交说明：${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY
          echo "- 提交人：${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- 触发方式：${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY

      - name: 打印最近版本记录
        run: git log --oneline -5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check backend Python syntax
        run: python -m py_compile backend/*.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Prepare SSH
        shell: bash
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
        run: |
          set -euo pipefail

          : "${TENCENT_HOST:?TENCENT_HOST secret is required}"
          : "${TENCENT_SSH_KEY:?TENCENT_SSH_KEY secret is required}"
          SSH_PORT="${SSH_PORT:-22}"

          # Strip trailing dot/port/path from host (e.g. root@ip → ip, ip:22 → ip)
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"
          HOST_CLEAN="${HOST_CLEAN%%/*}"
          echo "SSH target: $HOST_CLEAN port $SSH_PORT"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$TENCENT_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/tencent_deploy_key"
          chmod 600 "$HOME/.ssh/tencent_deploy_key"

          echo "Validating SSH private key format..."
          if ! ssh-keygen -y -f "$HOME/.ssh/tencent_deploy_key" >/dev/null 2>/tmp/ssh-keygen.err; then
            echo "SSH private key validation failed"
            cat /tmp/ssh-keygen.err || true
            exit 1
          fi
          echo "SSH private key format is valid"

          echo "Checking SSH connectivity..."
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/$HOST_CLEAN/$SSH_PORT" 2>/dev/null \
            && echo "SSH port reachable" \
            || echo "Warning: TCP check skipped or port unreachable (will retry via ssh-keyscan)"

          echo "Running ssh-keyscan..."
          SCAN_OK=false
          for attempt in 1 2 3; do
            echo "ssh-keyscan attempt $attempt/3"
            SCAN_FILE="$(mktemp)"
            if ssh-keyscan -T 20 -p "$SSH_PORT" -H "$HOST_CLEAN" >"$SCAN_FILE" 2>/tmp/ssh-keyscan.err; then
              cat "$SCAN_FILE" >> "$HOME/.ssh/known_hosts"
              rm -f "$SCAN_FILE"
              SCAN_OK=true
              break
            fi
            rm -f "$SCAN_FILE"
            echo "ssh-keyscan attempt $attempt failed"
            cat /tmp/ssh-keyscan.err || true
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          if [ "$SCAN_OK" != "true" ]; then
            echo "ssh-keyscan failed after 3 attempts. Check TENCENT_HOST / TENCENT_PORT / server SSH banner availability."
            echo "TENCENT_HOST is set: yes (length ${#TENCENT_HOST})"
            echo "Cleaned host: $HOST_CLEAN"
            echo "SSH_PORT: $SSH_PORT"
            echo "--- final ssh-keyscan stderr ---"
            cat /tmp/ssh-keyscan.err || true
            exit 1
          fi
          chmod 644 "$HOME/.ssh/known_hosts"
          echo "ssh-keyscan succeeded"

      - name: Deploy to Tencent Cloud
        shell: bash
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
          SSH_PORT: ${{ secrets.TENCENT_PORT || '22' }}
          ADMIN_LOGIN_CODE: ${{ secrets.ADMIN_LOGIN_CODE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          set -euo pipefail

          : "${TENCENT_HOST:?TENCENT_HOST secret is required}"
          : "${TENCENT_USER:?TENCENT_USER secret is required}"
          SSH_PORT="${SSH_PORT:-22}"
          ADMIN_CODE="${ADMIN_LOGIN_CODE:-}"
          HOST_CLEAN="${TENCENT_HOST#*@}"
          HOST_CLEAN="${HOST_CLEAN%%:*}"

          # Pass ADMIN_LOGIN_CODE as env var to the remote session
          ssh -i "$HOME/.ssh/tencent_deploy_key" -p "$SSH_PORT" "$TENCENT_USER@$HOST_CLEAN" \
            ADMIN_LOGIN_CODE="${ADMIN_LOGIN_CODE:-}" \
            SMTP_HOST="${SMTP_HOST:-}" \
            SMTP_PORT="${SMTP_PORT:-}" \
            SMTP_USER="${SMTP_USER:-}" \
            SMTP_PASSWORD="${SMTP_PASSWORD:-}" \
            SMTP_FROM="${SMTP_FROM:-}" \
            'bash -se' <<'DEPLOYEOF'
          set -euo pipefail

          cd ~/ai_study_platform

          export GIT_TERMINAL_PROMPT=0
          echo "[deploy] repository: $(pwd)"
          git remote -v
          fetch_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              echo "[deploy] git fetch attempt ${attempt}/3"
              if git -c http.version=HTTP/1.1 fetch --prune origin main 2>&1; then
                return 0
              fi
              echo "[deploy] git fetch failed on attempt ${attempt}"
              if [ "$attempt" -lt 3 ]; then sleep 10; fi
            done
            echo "[deploy] git fetch failed; repository diagnostics:"
            git status --short || true
            git rev-parse --show-toplevel || true
            git rev-parse HEAD || true
            return 1
          }
          fetch_with_retry
          git checkout main
          git reset --hard origin/main

          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
          fi

          if ! command -v gcc >/dev/null 2>&1 || ! command -v g++ >/dev/null 2>&1 || ! command -v javac >/dev/null 2>&1 || ! command -v java >/dev/null 2>&1 || ! command -v cmake >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gcc g++ cmake default-jdk-headless
          fi

          echo "=== 安装后端Python依赖 ==="
          if [ -x "backend/.venv/bin/pip" ]; then
            echo "[deploy] 使用 backend/.venv/bin/pip"
            backend/.venv/bin/pip install -r backend/requirements.txt
          elif [ -x ".venv/bin/pip" ]; then
            echo "[deploy] 使用 .venv/bin/pip"
            .venv/bin/pip install -r backend/requirements.txt
          elif [ -x "venv/bin/pip" ]; then
            echo "[deploy] 使用 venv/bin/pip"
            venv/bin/pip install -r backend/requirements.txt
          else
            echo "[deploy] 未找到虚拟环境，使用系统 python3"
            python3 -m pip install -r backend/requirements.txt
          fi
          echo "=== 依赖安装完成 ==="

          cd frontend
          npm ci
          npm run build
          cd ..

          sudo mkdir -p /var/www/ai_study_platform
          sudo rsync -a --delete frontend/dist/ /var/www/ai_study_platform/

          # ── Persistent database outside git worktree ──
          sudo mkdir -p /var/lib/ai_study_platform
          DATA_DB=/var/lib/ai_study_platform/app.db
          if [ -f backend/app.db ] && [ ! -f "$DATA_DB" ]; then
            echo "[deploy] 首次部署：迁移本地 app.db 到持久目录"
            cp backend/app.db "$DATA_DB"
          fi
          sudo chown -R $(whoami):$(whoami) /var/lib/ai_study_platform 2>/dev/null || true
          sudo chmod 755 /var/lib/ai_study_platform 2>/dev/null || true
          echo "[deploy] Persistent DB at $DATA_DB"

          # ── Configure persistent database for systemd service ──
          sudo mkdir -p /etc/systemd/system/ai-backend.service.d
          sudo tee /etc/systemd/system/ai-backend.service.d/database.conf > /dev/null <<INNEREOF
          [Service]
          Environment="DATABASE_URL=sqlite:////var/lib/ai_study_platform/app.db"
          INNEREOF
          sudo systemctl daemon-reload
          echo "[deploy] DATABASE_URL configured"

          # ── Configure ADMIN_LOGIN_CODE for systemd service ──
          if [ -n "${ADMIN_LOGIN_CODE:-}" ]; then
            echo "[deploy] Configuring ADMIN_LOGIN_CODE in systemd drop-in..."
            sudo tee /etc/systemd/system/ai-backend.service.d/admin-code.conf > /dev/null <<INNEREOF
          [Service]
          Environment="ADMIN_LOGIN_CODE=${ADMIN_LOGIN_CODE}"
          INNEREOF
            echo "[deploy] ADMIN_LOGIN_CODE configured via systemd drop-in"
          else
            echo "[deploy] ADMIN_LOGIN_CODE secret is empty — skipping config"
          fi

          # ── Configure SMTP for systemd service ──
          if [ -n "${SMTP_HOST:-}" ] && [ -n "${SMTP_USER:-}" ] && [ -n "${SMTP_PASSWORD:-}" ]; then
            echo "[deploy] Configuring SMTP in systemd drop-in..."
            sudo mkdir -p /etc/systemd/system/ai-backend.service.d
            sudo tee /etc/systemd/system/ai-backend.service.d/smtp.conf > /dev/null <<INNEREOF
          [Service]
          Environment="SMTP_HOST=${SMTP_HOST}"
          Environment="SMTP_PORT=${SMTP_PORT:-587}"
          Environment="SMTP_USER=${SMTP_USER}"
          Environment="SMTP_PASSWORD=${SMTP_PASSWORD}"
          Environment="SMTP_FROM=${SMTP_FROM:-${SMTP_USER}}"
          INNEREOF
            sudo systemctl daemon-reload
            echo "[deploy] SMTP configured via systemd drop-in"
          else
            echo "[deploy] SMTP secrets not fully configured — skipping email service"
          fi

          sudo systemctl daemon-reload
          sudo systemctl restart ai-backend
          sudo systemctl is-active --quiet ai-backend

          echo "=== 章节题库导入(持久DB, 不阻塞服务) ==="
          cd backend
          echo "=== Importing audited Exercism programming exercises ==="
          EXERCISM_SOURCE_ROOT=$(mktemp -d)
          clone_with_retry() {
            local repo_url="$1"
            local target="$2"
            local attempt
            for attempt in 1 2 3; do
              echo "[deploy] git clone attempt ${attempt}/3: ${repo_url}"
              if git clone --depth 1 --no-tags "$repo_url" "$target" 2>&1; then
                return 0
              fi
              echo "[deploy] git clone failed: ${repo_url}"
              rm -rf "$target"
              if [ "$attempt" -lt 3 ]; then sleep 10; fi
            done
            echo "[deploy] git clone failed after 3 attempts: ${repo_url}"
            return 1
          }
          clone_with_retry https://github.com/exercism/c.git "$EXERCISM_SOURCE_ROOT/c"
          clone_with_retry https://github.com/exercism/cpp.git "$EXERCISM_SOURCE_ROOT/cpp"
          clone_with_retry https://github.com/exercism/python.git "$EXERCISM_SOURCE_ROOT/python"
          PROGRAMMING_DB_BACKUP="$DATA_DB.before-programming-reconcile.$(date +%Y%m%d_%H%M%S).db"
          cp "$DATA_DB" "$PROGRAMMING_DB_BACKUP"
          echo "[deploy] Programming database backup: $PROGRAMMING_DB_BACKUP"
          DATABASE_URL="sqlite:///$DATA_DB" .venv/bin/python scripts/import_exercism_exercises.py \
            --source-root "$EXERCISM_SOURCE_ROOT" \
            --languages C \
            --slugs hello-world,reverse-string,acronym,bob,difference-of-squares,grains,leap,binary,collatz-conjecture,darts,dnd-character,eliuds-eggs,hamming,queen-attack,raindrops,resistor-color-duo,rna-transcription,space-age,two-fer,armstrong-numbers,binary-search,gigasecond,high-scores \
            --max-per-language 23 \
            --prune-unlisted
          DATABASE_URL="sqlite:///$DATA_DB" .venv/bin/python scripts/import_exercism_exercises.py \
            --source-root "$EXERCISM_SOURCE_ROOT" \
            --languages C++ \
            --slugs hello-world,reverse-string,acronym,bob,election-day,ellens-alien-game,freelancer-rates,interest-is-interesting,isbn-verifier,lasagna,lasagna-master,last-will,log-levels,luhn,making-the-grade,pacman-rules,power-of-troy,space-age,speedywagon,troll-the-trolls,collatz-conjecture,darts,grains \
            --max-per-language 23 \
            --prune-unlisted
          DATABASE_URL="sqlite:///$DATA_DB" .venv/bin/python scripts/import_exercism_exercises.py \
            --source-root "$EXERCISM_SOURCE_ROOT" \
            --languages Python \
            --slugs ledger,markdown,bob,hello-world,reverse-string,acronym,anagram,armstrong-numbers,binary-search,black-jack,card-games,cater-waiter,chaitanas-colossal-coaster,collatz-conjecture,currency-exchange,darts,difference-of-squares,electric-bill,ellens-alien-game,etl,flatten-array,ghost-gobble-arcade-game,gigasecond,grains,guidos-gorgeous-lasagna \
            --max-per-language 25 \
            --prune-unlisted
          rm -rf "$EXERCISM_SOURCE_ROOT"
          DATABASE_URL="sqlite:///$DATA_DB" .venv/bin/python exam_resources/11408/data_structure/chapter_questions/build_data_structure_chapter_questions.py || echo "[deploy] WARN: DS build failed"
          DATABASE_URL="sqlite:///$DATA_DB" .venv/bin/python exam_resources/11408/computer_organization/chapter_questions/build_computer_organization_chapter_questions.py || echo "[deploy] WARN: CO chapter build failed"
          DATABASE_URL="sqlite:///$DATA_DB" .venv/bin/python exam_resources/11408/computer_organization/past_papers/build_computer_organization_past_papers_text.py --apply || echo "[deploy] WARN: CO past papers build failed"
          DATABASE_URL="sqlite:///$DATA_DB" .venv/bin/python exam_resources/11408/operating_system/chapter_practice/build_operating_system_chapter_questions.py || echo "[deploy] WARN: OS chapter build failed"
          DATABASE_URL="sqlite:///$DATA_DB" .venv/bin/python exam_resources/11408/operating_system/past_papers/build_operating_system_past_papers.py || echo "[deploy] WARN: OS past papers build failed"
          DATABASE_URL="sqlite:///$DATA_DB" .venv/bin/python exam_resources/11408/computer_network/chapter_practice/build_computer_network_chapter_questions.py || echo "[deploy] WARN: CN chapter build failed"
          DATABASE_URL="sqlite:///$DATA_DB" .venv/bin/python exam_resources/11408/computer_network/past_papers/build_computer_network_past_papers.py || echo "[deploy] WARN: CN past papers build failed"
          cd ..
          sudo systemctl restart ai-backend

          echo "=== Waiting for backend health ==="
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              echo "[deploy] backend health ok"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "[deploy] backend health failed after restart"
              sudo systemctl status ai-backend --no-pager -l || true
              sudo journalctl -u ai-backend -n 80 --no-pager || true
              exit 1
            fi
            sleep 2
          done

          echo "=== Verifying nginx health ==="
          for i in {1..10}; do
            curl -fsS http://127.0.0.1/api/health >/dev/null
            sleep 1
          done
          DEPLOYEOF
