# Alembic configuration for zhixue-ai product backend.
# The actual database URL is resolved in migrations/env.py from DATABASE_URL
# or falls back to backend/database.py's DEFAULT (backend/app.db).

[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is intentionally empty here; env.py reads DATABASE_URL / database.DATABASE_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
